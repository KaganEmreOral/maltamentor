# Nginx config: maltamentor.com -> Next.js (port 3000)
# Kullanım: Bu dosyayı VPS'te /etc/nginx/sites-available/maltamentor.com olarak kopyala,
# sonra: sudo ln -s /etc/nginx/sites-available/maltamentor.com /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    server_name maltamentor.com www.maltamentor.com;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name maltamentor.com www.maltamentor.com;

    # SSL (Certbot ile kurduysan bu path'ler zaten var)
    ssl_certificate /etc/letsencrypt/live/maltamentor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maltamentor.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Next.js uygulamasına proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
